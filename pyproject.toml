[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dek"
version = "0.1.0"
description = "Delivery Evidence Kit — 让交付包里每个数字都钉到来源文件上"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Zhou Ruoying" }]
keywords = ["deliverable", "verification", "reproducibility", "evidence"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
dek = "dek.cli:main"

[tool.setuptools]
packages = ["dek"]
